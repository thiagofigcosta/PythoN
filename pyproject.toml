[project]
name = "pythonn"
version = "0.2.0"
description = "A curly-brace pre-compiler for Python with no runtime dependencies"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
